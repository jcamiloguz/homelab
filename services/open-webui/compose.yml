# Open WebUI — private web front-end for Hermes Agent (OpenAI-compatible API on 127.0.0.1:8642)
# Usage (from repo root):
#   docker compose -f services/open-webui/compose.yml --env-file .env up -d
# Exposed to the tailnet with: sudo tailscale serve --bg 3000
name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    network_mode: host            # reach Hermes on 127.0.0.1; ufw still blocks :3000 from the LAN
    environment:
      PORT: 3000                  # 8080 is reserved for Pi-hole
      OPENAI_API_BASE_URL: http://127.0.0.1:8642/v1
      OPENAI_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}   # set false after creating the admin account
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${DATA_DIR:-/srv/homelab}/open-webui:/app/backend/data
